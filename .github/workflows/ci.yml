name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The full e2e suite takes about 50 minutes, so it also runs every night on master.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A newer run on the same pull request replaces an older one that is still going. Runs on master
# are never cancelled, so the e2e result of a merge is not lost when the next one lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: portfolio_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/portfolio_build
      AUTH_SECRET: ci-dummy-secret
      NEXT_PUBLIC_SITE_URL: https://www.aristache.dev
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx eslint .

      - name: Format check
        run: bunx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Spell check
        run: bun run check:spell

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit & component tests
        run: bunx vitest run

      # The homepage uses ISR, so it is prerendered at build time and needs a
      # reachable database. Migrate + seed before building.
      - name: Run DB migrations
        run: bunx drizzle-kit migrate

      - name: Seed database
        run: bun run db:seed

      - name: Build
        run: bun run build

      # Routes and budgets share one server: starting `next start` twice would double
      # the slowest step in the job for no extra signal. Both are content-asserting
      # checks, so they need a real production server rather than the build output -
      # and check:vitals refuses to measure a dev server for exactly that reason.
      - name: Check routes and budgets
        run: |
          set +e
          bun run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 1
          done
          bun run check:routes
          ROUTES=$?
          bun run check:vitals
          VITALS=$?
          kill $SERVER_PID
          [ $ROUTES -eq 0 ] && [ $VITALS -eq 0 ]
        env:
          BASE_URL: http://localhost:3000

  # Pull requests get the build job (lint, format, spell, types, unit tests, build, routes and
  # budgets) in a few minutes. The full e2e suite runs after a merge, nightly and on demand.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A run blocked on one test would otherwise hold the runner for six hours.
    timeout-minutes: 90
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: portfolio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Migrate + seed before building: the ISR homepage is prerendered at
      # build time and queries the database.
      - name: Run DB migrations
        run: bunx drizzle-kit migrate
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/portfolio_e2e

      - name: Seed database
        run: bun run db:seed
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/portfolio_e2e
          NEXT_PUBLIC_SITE_URL: https://www.aristache.dev
          NEXT_PUBLIC_GTAG_ID: G-E2E000000

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/portfolio_e2e
          AUTH_SECRET: ci-dummy-secret
          NEXT_PUBLIC_SITE_URL: https://www.aristache.dev
          NEXT_PUBLIC_GTAG_ID: G-E2E000000

      - name: Install Playwright browsers
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium webkit

      - name: Run e2e tests
        run: bun run test:e2e
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/portfolio_e2e
          AUTH_SECRET: ci-dummy-secret
          NEXT_PUBLIC_SITE_URL: https://www.aristache.dev
          NEXT_PUBLIC_GTAG_ID: G-E2E000000
          CI: true

      - name: Upload development Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-development
          path: playwright-report/
          retention-days: 7

      - name: Run production e2e tests
        run: bun run test:e2e --config=playwright.production.config.ts
        env:
          DATABASE_URL: postgres://e2e:e2e@localhost:5432/portfolio_e2e
          AUTH_SECRET: ci-dummy-secret
          NEXT_PUBLIC_SITE_URL: https://www.aristache.dev
          NEXT_PUBLIC_GTAG_ID: G-E2E000000
          CI: true

      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report-production/
          retention-days: 7
